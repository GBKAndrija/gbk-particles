<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GBK Network</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
}
#tsparticles {
  width: 100%;
  height: 100%;
}
</style>
</head>

<body>
<div id="tsparticles"></div>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
<script>
tsParticles.load("tsparticles", {
  background: { color: "#ffffff" },
  fpsLimit: 60,
  detectRetina: true,

  /* 🎯 VRLO MALI BUFFER OKO KURSORA */
  interactivity: {
    detectsOn: "window",
    events: {
      onHover: { enable: true, mode: "repulse" },
      onClick: { enable: true, mode: "repulse" },
      resize: true
    },
    modes: {
      repulse: {
        distance: 80,        // 🔥 JOŠ MANJI buffer (precizno)
        duration: 0.22,
        speed: 3.5
      }
    }
  },

  particles: {
    number: {
      value: 120,
      density: { enable: true, area: 900 }
    },

    /* TAČKE OSTAJU ISTE (kao pre izmena) */
    shape: { type: "circle" },
    color: { value: "#345F98" },   // 🔵 JEDNA boja tačaka

    size: {
      value: { min: 1.5, max: 3 }
    },

    opacity: { value: 0.9 },

    /* LINIJE SU PLAVE + ŽUTE */
    links: {
      enable: true,
      color: {
        value: ["#345F98", "#F0B400"]  // 🔵🟡 kombinacija SAMO ZA LINIJE
      },
      distance: 190,
      opacity: 0.22,
      width: 1
    },

    move: {
      enable: true,
      speed: 2.6,
      outModes: { default: "out" }
    }
  }
});
</script>
</body>
</html>
