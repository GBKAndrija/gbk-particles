<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GBK Particles</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;   /* bela pozadina */
  overflow: hidden;
}
#tsparticles {
  width: 100%;
  height: 100%;
}
</style>
</head>

<body>
<div id="tsparticles"></div>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
<script>
tsParticles.load("tsparticles", {
  background: { color: "#ffffff" },
  fpsLimit: 60,
  detectRetina: true,

  /* interakcija – fina i nenapadna */
  interactivity: {
    detectsOn: "window",
    events: {
      onHover: { enable: true, mode: "grab" },
      onClick: { enable: true, mode: "repulse" },
      resize: true
    },
    modes: {
      grab: { distance: 240, links: { opacity: 1 } },
      repulse: { distance: 180, duration: 0.3 }
    }
  },

  particles: {
    number: {
      value: 120,              /* 🔹 srednja gustina */
      density: { enable: true, area: 900 }
    },

    shape: { type: "circle" },
    color: { value: "#345F98" }, /* plava */

    links: {
      enable: true,
      color: "#345F98",
      distance: 260,            /* 🔹 srednje često spajanje */
      opacity: 0.6,
      width: 1
    },

    move: {
      enable: true,
      speed: 3.2,               /* 🔹 primetno življe, ali ne agresivno */
      outModes: { default: "out" }
    },

    size: { value: { min: 1, max: 3 } },
    opacity: { value: { min: 0.6, max: 1 } }
  }
});
</script>
</body>
</html>
