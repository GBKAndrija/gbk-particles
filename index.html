<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GBK Particles</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#345F98; }
  #tsparticles { width:100%; height:100%; }
</style>
</head>
<body>
<div id="tsparticles"></div>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
<script>
tsParticles.load("tsparticles", {
  background: { color: "#345F98" },
  fpsLimit: 60,
  detectRetina: true,

  // ✅ INTERAKCIJA MIŠEM
  interactivity: {
    events: {
      onHover: { enable: true, mode: "grab" },   // hover "hvata" linije
      onClick: { enable: true, mode: "repulse" },// klik razbaca čestice
      resize: true
    },
    modes: {
      grab: { distance: 260, links: { opacity: 1 } },
      repulse: { distance: 180, duration: 0.4 }
    }
  },

  particles: {
    number: { value: 90, density: { enable: true, area: 900 } }, // više čestica = više veza
    shape: { type: "triangle" },
    color: { value: "#F0B400" },

    links: {
      enable: true,
      color: "#F0B400",
      distance: 340,     // VEĆE = mnogo češće se spajaju
      opacity: 0.85,
      width: 1
    },

    move: {
      enable: true,
      speed: 4.0,        // VEĆE = brže “menjaju” veze
      outModes: { default: "out" }
    },

    size: { value: { min: 1, max: 3 } },
    opacity: { value: { min: 0.6, max: 1 } }
  }
});
</script>
</body>
</html>
