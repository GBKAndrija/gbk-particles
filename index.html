<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GBK Particles</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #345F98;
  overflow: hidden;
}
#tsparticles {
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>

<div id="tsparticles"></div>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
<script>
tsParticles.load("tsparticles", {
  background: { color: "#345F98" },
  particles: {
    number: { value: 60 },
    shape: { type: "triangle" },
    color: { value: "#F0B400" },
    links: {
      enable: true,
      color: "#F0B400",
      distance: 260,
      opacity: 0.8
    },
    move: {
      enable: true,
      speed: 2.2
    },
    size: { value: { min: 1, max: 3 } },
    opacity: { value: 0.8 }
  }
});
</script>

</body>
</html>
