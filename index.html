<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GBK Network</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
}
#tsparticles {
  width: 100%;
  height: 100%;
}
</style>
</head>

<body>
<div id="tsparticles"></div>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
<script>
tsParticles.load("tsparticles", {
  background: { color: "#ffffff" },
  fpsLimit: 60,
  detectRetina: true,

  /* 🎯 PRELAZ MIŠEM = precizno "kidanje" */
  interactivity: {
    detectsOn: "window",
    events: {
      onHover: { enable: true, mode: "repulse" },
      onClick: { enable: true, mode: "repulse" },
      resize: true
    },
    modes: {
      repulse: {
        distance: 120,      // 🔥 mali buffer (probaj 90–130)
        duration: 0.25,
        speed: 3
      }
    }
  },

  particles: {
    number: {
      value: 120,          // 🔹 srednja gustina
      density: { enable: true, area: 900 }
    },

    /* TAČKE SU TAČKE */
    shape: { type: "circle" },

    /* PLAVA + ŽUTA (diskretno) */
    color: {
      value: ["#345F98", "#F0B400"]
    },

    size: {
      value: { min: 1.5, max: 3 }   // jasno vidljive tačke
    },

    opacity: { value: 0.9 },

    /* LINIJAMA NASTAJU "TROUGLOVI" */
    links: {
      enable: true,
      color: "#345F98",
      distance: 190,        // kontrolisana mreža
      opacity: 0.22,
      width: 1
    },

    move: {
      enable: true,
      speed: 2.6,
      outModes: { default: "out" }
    }
  }
});
</script>
</body>
</html>
