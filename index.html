<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GBK Network</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
}
#tsparticles {
  width: 100%;
  height: 100%;
}
</style>
</head>

<body>
<div id="tsparticles"></div>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
<script>
tsParticles.load("tsparticles", {
  background: { color: "#ffffff" },
  fpsLimit: 60,
  detectRetina: true,

  /* 🎯 HOVER = kidanje / zgušnjavanje */
  interactivity: {
    detectsOn: "window",
    events: {
      onHover: {
        enable: true,
        mode: ["grab", "repulse"]
      },
      onClick: {
        enable: true,
        mode: "repulse"
      },
      resize: true
    },
    modes: {
      grab: {
        distance: 220,
        links: { opacity: 1 }    // 🔥 blizu miša = jake linije
      },
      repulse: {
        distance: 260,
        duration: 0.3,
        speed: 3
      }
    }
  },

  particles: {
    number: {
      value: 100,
      density: { enable: true, area: 900 }
    },

    shape: { type: "triangle" },

    /* 🔵🟡 kombinacija boja */
    color: {
      value: ["#345F98", "#F0B400"]
    },

    size: {
      value: { min: 3.5, max: 6 }
    },

    opacity: { value: 1 },

    links: {
      enable: true,
      color: "#345F98",
      distance: 190,       // 🔑 kratko = vizuelno jače blizu
      opacity: 0.18,       // 🔑 slabije daleko
      width: 1
    },

    move: {
      enable: true,
      speed: 2.6,
      outModes: { default: "out" }
    }
  }
});
</script>
</body>
</html>
