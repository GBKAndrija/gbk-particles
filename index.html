<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GBK Particles</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;     /* BELA POZADINA */
  overflow: hidden;
}
#tsparticles {
  width: 100%;
  height: 100%;
}
</style>
</head>

<body>
<div id="tsparticles"></div>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
<script>
tsParticles.load("tsparticles", {
  background: { color: "#ffffff" },
  fpsLimit: 120,
  detectRetina: true,

  /* 🔥 INTERAKTIVNO SA MIŠEM */
  interactivity: {
    detectsOn: "window",
    events: {
      onHover: {
        enable: true,
        mode: "grab"
      },
      onClick: {
        enable: true,
        mode: "repulse"
      },
      resize: true
    },
    modes: {
      grab: {
        distance: 380,
        links: { opacity: 1 }
      },
      repulse: {
        distance: 260,
        duration: 0.3
      }
    }
  },

  particles: {
    number: {
      value: 220,                 /* 🔥 MNOGO VIŠE TAČKICA */
      density: { enable: true, area: 800 }
    },

    shape: { type: "triangle" },

    color: { value: "#345F98" },   /* PLAVA BOJA */

    links: {
      enable: true,
      color: "#345F98",
      distance: 420,               /* 🔥 VEOMA ČESTO SPAJANJE */
      opacity: 0.9,
      width: 1
    },

    move: {
      enable: true,
      speed: 6.5,                  /* 🔥 BRZO KRETANJE */
      outModes: { default: "out" }
    },

    size: {
      value: { min: 1, max: 3 }
    },

    opacity: {
      value: { min: 0.6, max: 1 }
    }
  }
});
</script>
</body>
</html>
