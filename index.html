<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GBK Triangulated Mesh</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#fff; }
  #tsparticles { width:100%; height:100%; }
</style>
</head>
<body>
<div id="tsparticles"></div>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
<script>
tsParticles.load("tsparticles", {
  background: { color: "#ffffff" },
  fpsLimit: 120,
  detectRetina: true,

  interactivity: {
    detectsOn: "window",
    events: {
      onHover: { enable: true, mode: ["grab"] },
      onClick: { enable: true, mode: ["repulse"] },
      resize: true
    },
    modes: {
      grab: { distance: 350, links: { opacity: 1 } },
      repulse: { distance: 220, duration: 0.25 }
    }
  },

  particles: {
    number: { value: 260, density: { enable: true, area: 900 } },

    // tačkice nek budu sitne i plave
    color: { value: "#345F98" },
    shape: { type: "circle" },
    size: { value: { min: 1, max: 2 } },
    opacity: { value: 0.9 },

    move: {
      enable: true,
      speed: 7.5,
      outModes: { default: "out" }
    },

    links: {
      enable: true,
      color: "#345F98",
      distance: 180,     // manja distance = "tvrđa" mreža i više trouglova u blizini
      opacity: 0.45,
      width: 1,

      // ✅ OVO je "PRAVI" triangulated look
      triangles: {
        enable: true,
        color: "#345F98",
        opacity: 0.16     // povećaj na 0.25 ako hoćeš punije trouglove
      }
    }
  }
});
</script>
</body>
</html>
