<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GBK Network</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
}
#tsparticles {
  width: 100%;
  height: 100%;
}
</style>
</head>

<body>
<div id="tsparticles"></div>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
<script>
tsParticles.load("tsparticles", {
  background: { color: "#ffffff" },
  fpsLimit: 60,
  detectRetina: true,

  /* 🎯 ULTRA MALI BUFFER + GLATKO */
  interactivity: {
    detectsOn: "window",
    events: {
      onHover: { enable: true, mode: ["bubble", "grab"] },
      onClick: { enable: true, mode: "repulse" },
      resize: true
    },
    modes: {
      /* bubble = najfinije rastavljanje/sastavljanje */
      bubble: {
        distance: 60,        // 🔥 JOŠ MANJI BUFFER (ranije 90)
        duration: 1.8,       // duže = mekši povratak
        size: 3.6,           // diskretno povećanje
        opacity: 1
      },

      /* grab = blago "privlačenje" linija */
      grab: {
        distance: 120,       // smanjeno (ranije 170)
        links: { opacity: 0.75 }
      },

      /* klik = jedini jači impuls */
      repulse: {
        distance: 140,
        duration: 0.35,
        speed: 3
      }
    }
  },

  particles: {
    number: {
      value: 120,
      density: { enable: true, area: 900 }
    },

    /* TAČKE OSTAJU TAČKE */
    shape: { type: "circle" },
    color: { value: "#345F98" },

    size: {
      value: { min: 1.5, max: 3 }
    },

    opacity: { value: 0.9 },

    /* LINIJE – plava + žuta kombinacija */
    links: {
      enable: true,
      color: { value: ["#345F98", "#F0B400"] },
      distance: 185,
      opacity: 0.22,
      width: 1
    },

    move: {
      enable: true,
      speed: 2.2,           // ⬅️ sporije = gracioznije
      outModes: { default: "out" }
    }
  }
});
</script>
</body>
</html>
