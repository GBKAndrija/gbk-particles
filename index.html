<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GBK Network</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
}
#tsparticles {
  width: 100%;
  height: 100%;
}
</style>
</head>

<body>
<div id="tsparticles"></div>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
<script>
tsParticles.load("tsparticles", {
  background: { color: "#ffffff" },
  fpsLimit: 60,
  detectRetina: true,

  /* 🎯 BLAGO VEĆI BUFFER + GLATKO */
  interactivity: {
    detectsOn: "window",
    events: {
      onHover: { enable: true, mode: ["bubble", "grab"] },
      onClick: { enable: true, mode: "repulse" },
      resize: true
    },
    modes: {
      bubble: {
        distance: 75,     // ⬅️ malo veći (ranije 60)
        duration: 1.6,
        size: 3.6,
        opacity: 1
      },
      grab: {
        distance: 140,    // ⬅️ malo veći (ranije 120)
        links: { opacity: 0.7 }
      },
      repulse: {
        distance: 150,
        duration: 0.32,
        speed: 3
      }
    }
  },

  particles: {
    number: {
      value: 120,
      density: { enable: true, area: 900 }
    },

    /* TAČKE SU TAČKE */
    shape: { type: "circle" },

    /* SAMO PLAVA BOJA */
    color: { value: "#345F98" },

    size: {
      value: { min: 1.5, max: 3 }
    },

    opacity: { value: 0.9 },

    /* LINIJE – SAMO PLAVE */
    links: {
      enable: true,
      color: "#345F98",
      distance: 190,
      opacity: 0.22,
      width: 1
    },

    move: {
      enable: true,
      speed: 2.2,
      outModes: { default: "out" }
    }
  }
});
</script>
</body>
</html>
