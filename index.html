<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GBK Mesh</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
}
#tsparticles {
  width: 100%;
  height: 100%;
}
</style>
</head>

<body>
<div id="tsparticles"></div>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
<script>
tsParticles.load("tsparticles", {
  background: { color: "#ffffff" },
  fpsLimit: 60,
  detectRetina: true,

  /* 👉 PRAVA INTERAKCIJA */
  interactivity: {
    detectsOn: "window",
    events: {
      onHover: { enable: true, mode: "grab" },   // prelaz mišem
      onClick: { enable: true, mode: "repulse" },// klik
      resize: true
    },
    modes: {
      grab: {
        distance: 260,
        links: { opacity: 1 }
      },
      repulse: {
        distance: 200,
        duration: 0.4
      }
    }
  },

  particles: {
    number: {
      value: 160,                 // 🔹 dosta tačaka, ali kontrolisano
      density: { enable: true, area: 900 }
    },

    shape: { type: "circle" },    // sitne tačke
    color: { value: "#345F98" },  // PLAVA kao na slici

    size: {
      value: 1.2                  // ⬅️ vrlo male tačke (kao mesh čvorovi)
    },

    opacity: {
      value: 0.9
    },

    links: {
      enable: true,
      color: "#345F98",
      distance: 190,              // 🔥 KLJUČ: kratka distanca = gust mesh
      opacity: 0.25,               // tanke linije
      width: 1
    },

    move: {
      enable: true,
      speed: 2.4,                  // sporo kretanje = stabilna mreža
      outModes: { default: "out" }
    }
  }
});
</script>
</body>
</html>
